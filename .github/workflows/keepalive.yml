name: Keep Backend Alive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    env:
      BACKEND_URL: ${{ secrets.BACKEND_URL }}

    steps:
      - name: Ping backend health route
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "BACKEND_URL secret is not set at $(date)"
            exit 1
          fi

          HEALTH_URL="${BACKEND_URL%/}/health"

          for i in {1..3}; do
            if curl -fsS "$HEALTH_URL"; then
              echo "Ping successful at $(date)"
              exit 0
            else
              echo "Ping failed at $(date), retry $i"
              sleep 10
            fi
          done
          echo "All retries failed at $(date)"
          exit 1
